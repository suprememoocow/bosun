# Example Bosun configuration.
#
# Sources: the built-in `static` source (records straight from config, the
# permanent test-fixture mechanism) and the `omada` plugin (bosun-plugin-omada),
# which reads DHCP reservations from a local Omada SDN controller.
#
# Secrets use ${env:...} / ${file:...} expansion; `bosun validate` warns on any
# plaintext password.
version: 1

plugins:
  dir: /usr/local/libexec/bosun
  timeout: 30s
  max_concurrency: 4
  max_records: 50000 # per-source cap; a plugin exceeding it is a failed source

adguard:
  address: ${env:ADGUARD_ADDRESS}
  username: ${env:ADGUARD_USER}
  password: ${env:ADGUARD_PASSWORD}

sources:
  - id: fixture
    type: static
    config:
      hosts:
        - name: NAS
          ip: 192.168.0.10
          mac: aa:bb:cc:dd:ee:ff
          labels: { role: server }
        - name: printer
          ip: 192.168.0.20
        - name: laptop-v6-only
          ip: fd00::5 # dropped in v1 (IPv6), leaving no address -> record drops out

  - id: omada
    type: omada # resolves to the bosun-plugin-omada binary
    config:
      address: https://192.168.0.1:8043
      username: ${env:OMADA_USER}
      password: ${env:OMADA_PASSWORD}
      site: Default
      insecure_skip_verify: true # controller uses a self-signed cert
      # dhcp_reservations only: stable and present for offline devices, so it
      # plays well with prune. online_clients churns as devices sleep (§6.1).
      include: [dhcp_reservations]

adguard_clients:
  # Concatenated in order; earlier sources take precedence on conflict.
  sources: [omada, fixture]

  # Predicate tree (implicit `all` at the top level): keep home-LAN devices,
  # drop noisy per-app Android hostnames.
  filter:
    - any:
        - cidr: 192.168.0.0/24
        - cidr: 192.168.30.0/24
    - not:
        name: "android-*"

  # Applied to every client we create.
  defaults:
    use_global_settings: true
    filtering_enabled: true

  # Enrichment tags a client using AdGuard's fixed tag vocabulary. `set` replaces
  # the tag set; `merge` unions into it. Rules run in order; all matching apply.
  # (Tags are only reconciled on existing clients when enrichment is configured.)
  enrichment:
    - match: { label: { role: server } }
      set:
        tags: [device_other]
    - match: { cidr: 192.168.30.0/24 }
      merge:
        tags: [user_child]

  # Only ip/mac clients are managed; subnet/ClientID clients are vetoed outright.
  managed_id_kinds: [ip, mac]
  on_mixed_ids: skip # a client mixing managed and unmanaged ids is left alone

  # Two devices can share an Omada hostname across VLANs. On a name clash, prefix
  # every member deterministically: try the template, then fall back to the
  # MAC suffix (guaranteed unique). Non-clashing names are left untouched.
  on_name_clash:
    template: "{{ .Labels.omada_network }}-{{ .Name }}"
    fallback: mac_suffix # mac_suffix | source | error

  # Which live clients bosun may prune. include defaults to "*"; exclude protects
  # hand-made clients whose names are predictable.
  ownership:
    include: ["*"]
    exclude: ["guest-*"]

  # Delete owned clients no longer present in the desired set. `apply` guards this
  # with safety rails: --max-deletes N and --max-delete-fraction (default 0.2,
  # over manageable live clients). To pin a hand-made client against pruning, add
  # a /32 id to it in the AdGuard UI — that vetoes it (§7.4).
  prune: true
