# Example Bosun configuration using the built-in `static` source, which reads
# records straight from config and is the permanent test-fixture mechanism.
version: 1

plugins:
  dir: /usr/local/libexec/bosun
  timeout: 30s
  max_concurrency: 4

adguard:
  address: ${env:ADGUARD_ADDRESS}
  username: ${env:ADGUARD_USER}
  password: ${env:ADGUARD_PASSWORD}

sources:
  - id: fixture
    type: static
    config:
      hosts:
        - name: NAS
          ip: 192.168.0.10
          mac: aa:bb:cc:dd:ee:ff
          labels: { role: server }
        - name: printer
          ip: 192.168.0.20
        - name: laptop-v6-only
          ip: fd00::5 # dropped in v1 (IPv6), leaving no address -> record drops out

adguard_clients:
  sources: [fixture]
  filter:
    - cidr: 192.168.0.0/24
  managed_id_kinds: [ip, mac]
  prune: true
